server {
    listen 80;
    listen [::]:80;
    server_name ammarco.com.pk www.ammarco.com.pk;

    root /srv/www/ammarco.pk/ammarco-prime-forge/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ammarco.com.pk www.ammarco.com.pk;

    ssl_certificate /etc/nginx/ssl/ammarco.com.pk/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ammarco.com.pk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/www/ammarco.pk/ammarco-prime-forge/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
