name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ssh_port:
        description: "SSH port if SERVER_PORT is unset. Leave blank to use SERVER_PORT or 2321."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ammarco-production
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build production site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Server
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_PORT: ${{ github.event.inputs.ssh_port || secrets.SERVER_PORT || 2321 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist

      - name: Upload build and Nginx config
        id: upload
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PASSWORD_SSH }}
          passphrase: ${{ secrets.SERVER_PASSPHASE_KEY }}
          timeout: 120s
          command_timeout: 20m
          source: dist,deploy/nginx,deploy/systemd,server
          target: /tmp/ammarco-release-${{ github.run_id }}

      - name: Retry build upload after network timeout
        if: steps.upload.outcome == 'failure'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PASSWORD_SSH }}
          passphrase: ${{ secrets.SERVER_PASSPHASE_KEY }}
          timeout: 120s
          command_timeout: 20m
          source: dist,deploy/nginx,deploy/systemd,server
          target: /tmp/ammarco-release-${{ github.run_id }}
          overwrite: true

      - name: Activate build, Nginx vhost, and rotate backups
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_ID: ${{ github.run_id }}
          SERVER_MAIN_PASSWORD: ${{ secrets.SERVER_MAIN_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PASSWORD_SSH }}
          passphrase: ${{ secrets.SERVER_PASSPHASE_KEY }}
          timeout: 120s
          envs: RELEASE_ID,SERVER_MAIN_PASSWORD,SMTP_PASSWORD
          script: |
            set -eu

            APP_DIR=/srv/www/ammarco.pk/ammarco-prime-forge
            DIST_DIR="$APP_DIR/dist"
            BACKUP_DIR=/srv/www/ammarco.pk/backups
            RELEASE_ROOT="/tmp/ammarco-release-$RELEASE_ID"
            RELEASE_DIR="$RELEASE_ROOT/dist"
            NGINX_SRC="$RELEASE_ROOT/deploy/nginx/ammarco.com.pk.conf"
            STAGING_DIR="$APP_DIR/.dist-staging-$RELEASE_ID"
            PREVIOUS_DIR="$APP_DIR/.dist-previous-$RELEASE_ID"
            BACKUP_NAME="deploy-$(date -u +%Y%m%dT%H%M%SZ)-$RELEASE_ID"

            run_sudo() {
              if [ -n "${SERVER_MAIN_PASSWORD:-}" ]; then
                printf '%s\n' "$SERVER_MAIN_PASSWORD" | sudo -S -p '' "$@"
              elif sudo -n true >/dev/null 2>&1; then
                sudo -n "$@"
              else
                echo "sudo is required for: $*" >&2
                exit 1
              fi
            }

            test -f "$RELEASE_DIR/index.html"
            mkdir -p "$BACKUP_DIR"
            rm -rf "$STAGING_DIR" "$PREVIOUS_DIR"
            cp -a "$RELEASE_DIR" "$STAGING_DIR"

            if [ -d "$DIST_DIR" ]; then
              cp -a "$DIST_DIR" "$BACKUP_DIR/$BACKUP_NAME"
              mv "$DIST_DIR" "$PREVIOUS_DIR"
            fi

            if ! mv "$STAGING_DIR" "$DIST_DIR"; then
              if [ -d "$PREVIOUS_DIR" ]; then
                mv "$PREVIOUS_DIR" "$DIST_DIR"
              fi
              exit 1
            fi

            SSL_DIR=/etc/nginx/ssl/ammarco.com.pk
            run_sudo mkdir -p "$SSL_DIR"

            if [ -f /etc/letsencrypt/live/ammarco.com.pk/fullchain.pem ] && [ -f /etc/letsencrypt/live/ammarco.com.pk/privkey.pem ]; then
              run_sudo ln -sfn /etc/letsencrypt/live/ammarco.com.pk/fullchain.pem "$SSL_DIR/fullchain.pem"
              run_sudo ln -sfn /etc/letsencrypt/live/ammarco.com.pk/privkey.pem "$SSL_DIR/privkey.pem"
            elif [ ! -f "$SSL_DIR/fullchain.pem" ] || [ ! -f "$SSL_DIR/privkey.pem" ]; then
              ORIGIN_KEY=/tmp/ammarco-origin-$RELEASE_ID.key
              ORIGIN_CRT=/tmp/ammarco-origin-$RELEASE_ID.crt
              openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
                -keyout "$ORIGIN_KEY" -out "$ORIGIN_CRT" \
                -config "$RELEASE_ROOT/deploy/nginx/ammarco-origin.cnf"
              run_sudo mv "$ORIGIN_KEY" "$SSL_DIR/privkey.pem"
              run_sudo mv "$ORIGIN_CRT" "$SSL_DIR/fullchain.pem"
              run_sudo chmod 600 "$SSL_DIR/privkey.pem"
              run_sudo chmod 644 "$SSL_DIR/fullchain.pem"
            fi

            if [ -f "$NGINX_SRC" ]; then
              if [ -d /etc/nginx/sites-available ]; then
                run_sudo cp "$NGINX_SRC" /etc/nginx/sites-available/ammarco.com.pk
                run_sudo ln -sfn /etc/nginx/sites-available/ammarco.com.pk /etc/nginx/sites-enabled/ammarco.com.pk
              else
                run_sudo cp "$NGINX_SRC" /etc/nginx/sites-enabled/ammarco.com.pk
              fi
            fi

            if ! run_sudo nginx -t || ! run_sudo systemctl reload nginx; then
              rm -rf "$DIST_DIR"
              if [ -d "$PREVIOUS_DIR" ]; then
                mv "$PREVIOUS_DIR" "$DIST_DIR"
              fi
              run_sudo systemctl reload nginx || run_sudo systemctl restart nginx || true
              exit 1
            fi

            mkdir -p "$APP_DIR/server"
            if [ -f "$RELEASE_ROOT/server/lead-mailer.py" ]; then
              cp "$RELEASE_ROOT/server/lead-mailer.py" "$APP_DIR/server/lead-mailer.py"
            fi

            if [ -n "${SMTP_PASSWORD:-}" ]; then
              umask 077
              {
                printf 'SMTP_HOST=%s\n' 'smtp.hostinger.com'
                printf 'SMTP_PORT=%s\n' '465'
                printf 'SMTP_USER=%s\n' 'ammar@ammarco.com.pk'
                printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
                printf 'SMTP_FROM=%s\n' 'ammar@ammarco.com.pk'
                printf 'SMTP_TO=%s\n' 'ammarco.pk@gmail.com'
                printf 'LEAD_HOST=%s\n' '127.0.0.1'
                printf 'LEAD_PORT=%s\n' '3847'
              } > "$APP_DIR/.env.mail"
              chmod 600 "$APP_DIR/.env.mail"
            fi

            if [ -f "$RELEASE_ROOT/deploy/systemd/ammarco-lead-mailer.service" ]; then
              run_sudo cp "$RELEASE_ROOT/deploy/systemd/ammarco-lead-mailer.service" /etc/systemd/system/ammarco-lead-mailer.service
              run_sudo systemctl daemon-reload
              run_sudo systemctl enable ammarco-lead-mailer
              run_sudo systemctl restart ammarco-lead-mailer
            fi

            rm -rf "$PREVIOUS_DIR" "$RELEASE_ROOT"

            find "$BACKUP_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn \
              | tail -n +6 \
              | cut -d' ' -f2- \
              | while IFS= read -r old_backup; do
                  rm -rf -- "$old_backup"
                done

            echo "Deployment $RELEASE_ID completed successfully."
